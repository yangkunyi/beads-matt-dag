# The pack's knobs for this Target (drain/scripts/config.ts).
#
# concurrency: 1 because this frontier is operator-ui tickets that all edit App.tsx / Graph.tsx /
# overview-test.ts. Drain 8e15a783 ran four of them at once; workers left dirty trees and merge-before-stamp
# recorded "nothing to merge" / unresolved conflict. Raise it again when the frontier is issues that do
# not share one client. The provider still allows more than one (micu measured six then ten).
#
# model: xai/grok-4.6 was the operator's choice on 2026-09-16, but the xAI account ran out of credits:
# drain 3a88033c failed five of six tickets with 403 "You have run out of credits". Moved to the highland
# gateway (same key as openai/google here), probed working 2026-09-18 for glm-5.3, glm-5.3-flash and
# gpt-6-astra. Unset, the runner takes its own default (micu/deepseek-flash as of 2026-09-15).
model: highland/glm-5.3
thinkingLevel: high
concurrency: 1

# The Target's post-merge act (pack README, "The post-merge act"): one command this repository runs
# itself after a merge lands, so the machine's copies of the flow never describe work Main does not have.
# `bun tools/flow.ts install` refreshes ~/.agents/skills/ from this checkout and checks the pack symlink
# ~/.archon/workflows/beads-dag; it is idempotent, it costs about a second, and it replaces the
# "remember to run install afterwards" step a ticket brief used to carry. `check` alone would only
# report the drift this act exists to prevent.
#
# What it copies is this checkout's working tree, not HEAD: during a drain that tree sits at Main with a
# clean skills/, which is why "right after a merge" is the correct moment for it. A session that edits
# skills/ itself installs again once the edit is committed.
postMerge: bun tools/flow.ts install
