# The pack's knobs for this Target (drain/scripts/config.ts).
#
# concurrency: 1, kept from 2026-09-18 but not for the reason first written here. The earlier note blamed
# four parallel operator-ui workers for dirty trees and "nothing to merge"; that was wrong. The cause was
# that every session had no shell at all (beads-dag/46): a worker could edit files but could never run its
# gate or commit, so whichever workers burned their wall clock hunting for a way to run a command failed
# and left their work uncommitted. With the shell back, the pack's own throttle is the only reason to keep
# this number low, and the current frontier is one ticket. Raise it when the frontier is issues that do not
# share one client. The provider allows more than one (micu measured six then ten).
#
# model: xai/grok-4.6 was the operator's choice on 2026-09-16, but the xAI account ran out of credits:
# drain 3a88033c failed five of six tickets with 403 "You have run out of credits". Operator then chose
# packy/deepseek-flash at thinkingLevel high (2026-09-18); its thinkingLevelMap maps high to high and the
# gateway probed working with thinking enabled. Unset, the runner takes its own default
# (micu/deepseek-flash as of 2026-09-15).
model: packy/deepseek-flash
thinkingLevel: high
concurrency: 1

# Machine loom/skills currently come from /data3/yky/beads-attention (operator switch 2026-09-20).
# A postMerge install from this checkout would retarget ~/.archon/workflows/beads-dag and overwrite
# those skills. Keep empty until the clone is merged back.
postMerge: ""
