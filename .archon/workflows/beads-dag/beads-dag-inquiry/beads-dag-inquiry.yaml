name: beads-dag-inquiry
description: |
  Read questions on this Target: ask the store which questions are on the reading frontier, claim them in
  one transaction, read each one, land its note and receipts as documents on Main, and leave a draft answer
  on the ticket. The ticket stays open: the last word - the final answer and the close - is a session's, on
  the operator's word. The run ends with `report.md`: the questions it read and where each landed, the ones
  it failed with the store's own reason and ordinal, the frontier it left behind, and the draft answers now
  awaiting the operator. Install this pack folder as ~/.archon/workflows/beads-dag; a symlink to a checkout
  is the intended install. The Target does not commit .archon/.
worktree:
  enabled: false
inputs:
  config:
    default: .scratch/beads-dag.yaml
    description: Path to YAML with model, thinkingLevel, concurrency, runner
nodes:
  - id: open
    script: open
    runtime: bun
    always_run: true
    with:
      config: $INPUTS.config
  - id: reading
    depends_on: [open]
    loop_group:
      max_iterations: 500
      until_bash: test $pick.output = "[]"
      nodes:
        - id: pick
          script: pick
          runtime: bun
          with:
            config: $INPUTS.config
        - id: read
          include: beads-dag-read
          depends_on: [pick]
          with:
            config: $INPUTS.config
          fan_out:
            # The throttle is config.concurrency: pick prints at most that many handles, so this launches
            # the batch the pool can take, not every question on the frontier. One instance per handle.
            items: "$pick.output"
            as: issue
            # all_success, for the same reason the drain's fan-out is: a reading's own outcome is exit 0
            # (landed and failed are both results), so an instance only fails when a node THREW - a runner
            # that cannot start, or a pack bug - and that must fail the run loudly.
            join: all_success
  - id: report
    script: report
    runtime: bun
    depends_on: [reading]
    with:
      config: $INPUTS.config
