name: beads-dag-execute
description: |
  One issue, start to finish: implement it in its own worktree, bring Main into that worktree, merge it
  into Main, and resolve a conflict in this same execution. Not a public drain entry: the issue input is
  required.
mutates_checkout: false
# No `returns:` here, deliberately. The predecessor needed it because its last node sat behind a `when:`,
# and archon reads an instance whose last node was skipped as "stopped without a terminal state", which
# failed the drain's fan-out node and skipped the drain-end readers. This workflow is one node that
# always runs, so the instance is terminal by construction and there is no node to name.
inputs:
  issue:
    required: true
    description: Issue handle (feature/NN, as carried on the issue)
  config:
    default: .scratch/beads-dag.yaml
    description: Path to YAML with model, thinkingLevel, concurrency, runner
nodes:
  - id: execute
    script: execute
    runtime: bun
    # Long enough for both turns and both gates. The role table's wall clock is 2 h per turn and one node
    # runs both (2 x 7 200 000), and each settle is preceded by the Target's gate for up to
    # DEFAULT_VERIFY_TIMEOUT_MS (2 x 900 000), so the node's own budget is 16 200 000 ms; with the same
    # 10-minute margin the single-turn form had, 16 800 000. The contract test computes the same sum.
    timeout: 16800000
    with:
      issue: $INPUTS.issue
      config: $INPUTS.config
